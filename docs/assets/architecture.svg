<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="960" height="540" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Headers -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">SYSTEM ARCHITECTURE</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b">End-to-end data flow from wrist kinematics to simulated desktop input</text>

  <!-- COLUMN 1: SMARTWATCH HARDWARE -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="250" height="400" rx="10" fill="#131c2e" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="42" rx="10" fill="#1e293b" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">1. SMARTWATCH (PERIPHERAL)</text>

    <!-- Card 1.1: G-Sensor -->
    <rect x="16" y="58" width="218" height="74" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="28" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">3-Axis G-Sensor</text>
    <text x="28" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Continuous wrist acceleration &amp;</text>
    <text x="28" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">jerk detection (shutter trigger)</text>

    <!-- Arrow Down -->
    <path d="M 125 132 L 125 152" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="125,157 121,149 129,149" fill="#64748b" />

    <!-- Card 1.2: Firmware Shutter Mode -->
    <rect x="16" y="160" width="218" height="74" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="28" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Opcode 0x66 Shutter Mode</text>
    <text x="28" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Watch enters gesture listening state;</text>
    <text x="28" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">emits 0x66 notification on wrist flick</text>

    <!-- Arrow Down -->
    <path d="M 125 234 L 125 254" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="125,259 121,251 129,251" fill="#64748b" />

    <!-- Card 1.3: BLE Radio -->
    <rect x="16" y="262" width="218" height="116" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="28" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#34d399">BLE GATT Radio (0xFEEA)</text>
    <text x="28" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Write Pipe: <tspan fill="#38bdf8">0xFEE2</tspan></text>
    <text x="28" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Notify Pipe: <tspan fill="#34d399">0xFEE3</tspan></text>
    <text x="28" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Packet framing: <tspan fill="#fbbf24">FE EA 20 ..</tspan></text>
    <text x="28" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Realtek / DaFit / Fire-Boltt 184</text>
  </g>

  <!-- BUS CONNECTIONS: BLUETOOTH LE OVER AIR -->
  <g transform="translate(290, 230)">
    <!-- Heartbeat Line (Left) -->
    <path d="M 64 20 L 0 20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <polygon points="0,20 8,16 8,24" fill="#38bdf8" />
    <text x="32" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">Heartbeat (6s)</text>

    <!-- Notification Line (Right) -->
    <path d="M 0 70 L 64 70" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <polygon points="64,70 56,66 56,74" fill="#34d399" />
    <text x="32" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">Flick Event (0x66)</text>
  </g>

  <!-- COLUMN 2: WATCHGESTURE CORE ENGINE -->
  <g transform="translate(355, 95)" filter="url(#cardShadow)">
    <rect width="290" height="400" rx="10" fill="#131c2e" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="290" height="42" rx="10" fill="#1e293b" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#818cf8">2. WATCHGESTURE CORE ENGINE</text>

    <!-- Card 2.1: Bleak Async Client -->
    <rect x="16" y="58" width="258" height="66" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="28" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Bleak Client &amp; Heartbeat</text>
    <text x="28" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Autonomous keepalive coroutine writes</text>
    <text x="28" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#38bdf8">FE EA 20 06 66 01 every 6.0 seconds</text>

    <!-- Card 2.2: Packet Decoder -->
    <rect x="16" y="132" width="258" height="60" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="28" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">V2 Protocol Decoder</text>
    <text x="28" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Validates magic header, decodes length,</text>
    <text x="28" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">extracts Opcode 0x66 &amp; verifies payload</text>

    <!-- Card 2.3: State Machine & Timing -->
    <rect x="16" y="200" width="258" height="110" rx="8" fill="#1a2438" stroke="#818cf8" stroke-width="1.2" />
    <text x="28" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#c084fc">Gesture State Machine (FSM)</text>
    <text x="28" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">⚙️ <tspan fill="#f1f5f9">Debounce Gap:</tspan> min 0.28s (filters rebound)</text>
    <text x="28" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">⏱️ <tspan fill="#f1f5f9">Sliding Window:</tspan> 1.00s collection period</text>
    <text x="28" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">🔒 <tspan fill="#f1f5f9">Lockout Cooldown:</tspan> 0.40s settle window</text>
    <text x="28" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#34d399">⚡ 3-Flick Instant Fire: skips window timeout</text>

    <!-- Card 2.4: Action Dispatcher -->
    <rect x="16" y="318" width="258" height="60" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="28" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Action Dispatcher &amp; Profiles</text>
    <text x="28" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Maps (1, 2, 3) taps to active profile</text>
    <text x="28" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#fbbf24">Reels / Shorts / Media / Slides / Custom</text>
  </g>

  <!-- ARROW FROM ENGINE TO DISPATCH -->
  <g transform="translate(645, 290)">
    <path d="M 0 0 L 40 0" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <polygon points="40,0 32,-4 32,4" fill="#f43f5e" />
  </g>

  <!-- COLUMN 3: OS & APPLICATIONS -->
  <g transform="translate(685, 95)" filter="url(#cardShadow)">
    <rect width="235" height="400" rx="10" fill="#131c2e" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="235" height="42" rx="10" fill="#1e293b" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f43f5e">3. OS INPUT &amp; APPS</text>

    <!-- Card 3.1: Keystroke Injection -->
    <rect x="16" y="58" width="203" height="84" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="26" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Input Simulation</text>
    <text x="26" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• PyAutoGUI keyboard events</text>
    <text x="26" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Win32 keybd_event API</text>
    <text x="26" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Zero UI lag &amp; 0ms overhead</text>

    <!-- Card 3.2: Target Windows App -->
    <rect x="16" y="150" width="203" height="126" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="26" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Target Active Window</text>
    <text x="26" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">1 Flick  ➡️  <tspan fill="#34d399">DOWN (Next Reel)</tspan></text>
    <text x="26" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">2 Flicks ➡️  <tspan fill="#38bdf8">UP (Prev Reel)</tspan></text>
    <text x="26" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">3 Flicks ➡️  <tspan fill="#fbbf24">WIN + D (Boss Key)</tspan></text>
    <text x="26" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#64748b">Chrome, Edge, Spotify, PPT, etc.</text>

    <!-- Card 3.3: Interactive GUI & CLI -->
    <rect x="16" y="286" width="203" height="92" rx="8" fill="#1a2438" stroke="#334155" />
    <text x="26" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a855f7">Frontend Interfaces</text>
    <text x="26" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Modern Tkinter GUI</text>
    <text x="26" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Live Gesture Radar &amp; Telemetry</text>
    <text x="26" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• CLI: scan, sniff, run, profiles</text>
  </g>
</svg>

