<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="nodeShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="960" height="480" rx="14" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5" />

  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">GESTURE TIMING &amp; DEBOUNCE STATE MACHINE</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b">Sliding time window with dynamic debounce and zero-latency instant triggering</text>

  <!-- STATE 1: IDLE -->
  <g transform="translate(60, 160)" filter="url(#nodeShadow)">
    <rect width="160" height="100" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">STATE: IDLE</text>
    <text x="80" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">flick_count = 0</text>
    <text x="80" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Awaiting wrist flick</text>
  </g>

  <!-- ARROW 1 -> 2 (FIRST FLICK) -->
  <path d="M 220 210 L 320 210" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <polygon points="320,210 312,206 312,214" fill="#38bdf8" />
  <text x="270" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">1st Flick Detected</text>
  <text x="270" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Start 1.0s Window</text>

  <!-- STATE 2: WINDOW ACCUMULATION -->
  <g transform="translate(325, 140)" filter="url(#nodeShadow)">
    <rect width="210" height="140" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <text x="105" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">WINDOW ACTIVE</text>
    <text x="105" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f1f5f9" text-anchor="middle">Timer: 0.0s ➡️ 1.00s</text>
    <line x1="16" y1="68" x2="194" y2="68" stroke="#334155" stroke-width="1" />
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Gap &lt; 0.28s ➡️ <tspan fill="#f87171">Discard Wobble</tspan></text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Gap ≥ 0.28s ➡️ <tspan fill="#34d399">flick_count++</tspan></text>
    <text x="24" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">• Count reaches 3 ➡️ <tspan fill="#fbbf24">Instant Fire</tspan></text>
  </g>

  <!-- ARROW: TIMEOUT PATH (TO EVALUATION) -->
  <path d="M 535 180 L 635 130" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <polygon points="635,130 626,132 630,139" fill="#34d399" />
  <text x="605" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#34d399">Window Expired (1.0s)</text>

  <!-- ARROW: INSTANT 3-FLICK PATH -->
  <path d="M 535 240 L 635 290" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <polygon points="635,290 630,281 626,288" fill="#fbbf24" />
  <text x="615" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#fbbf24">Instant: Count == 3</text>

  <!-- STATE 3A: TIMED ACTION DISPATCH -->
  <g transform="translate(640, 80)" filter="url(#nodeShadow)">
    <rect width="260" height="90" rx="10" fill="#131c2e" stroke="#34d399" stroke-width="1.5" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#34d399">DISPATCH ACTION (1x / 2x)</text>
    <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">1 Flick  ➡️  <tspan fill="#f1f5f9" font-weight="700">DOWN</tspan> (Next Reel)</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">2 Flicks ➡️  <tspan fill="#f1f5f9" font-weight="700">UP</tspan> (Previous Reel)</text>
  </g>

  <!-- STATE 3B: INSTANT BOSS KEY DISPATCH -->
  <g transform="translate(640, 250)" filter="url(#nodeShadow)">
    <rect width="260" height="90" rx="10" fill="#131c2e" stroke="#fbbf24" stroke-width="1.5" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fbbf24">INSTANT ACTION (3x)</text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">3 Flicks ➡️  <tspan fill="#f1f5f9" font-weight="700">WIN + D</tspan> (Boss Key)</text>
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Bypasses timer; executes in &lt;1ms</text>
  </g>

  <!-- STATE 4: LOCKOUT COOLDOWN -->
  <g transform="translate(370, 360)" filter="url(#nodeShadow)">
    <rect width="220" height="74" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="110" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">LOCKOUT COOLDOWN</text>
    <text x="110" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f1f5f9" text-anchor="middle">Duration: 0.40s Cooldown</text>
    <text x="110" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Dampens post-action arm recoil</text>
  </g>

  <!-- FLOW PATHS INTO LOCKOUT -->
  <path d="M 770 170 L 770 397 L 590 397" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
  <polygon points="590,397 598,393 598,401" fill="#64748b" />

  <path d="M 770 340 L 770 397" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- RETURN TO IDLE -->
  <path d="M 370 397 L 140 397 L 140 260" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <polygon points="140,260 136,268 144,268" fill="#38bdf8" />
  <text x="240" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Lockout Expired ➡️ Reset to IDLE</text>
</svg>

