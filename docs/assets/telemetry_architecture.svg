<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30"/>
      <stop offset="100%" stop-color="#0d131f"/>
    </linearGradient>
    <linearGradient id="cardGradAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a273b"/>
      <stop offset="100%" stop-color="#0f1826"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrows -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 L3,4 Z" fill="#00f2fe" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 L3,4 Z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 L3,4 Z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="440" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(40, 42)">
    <circle cx="12" cy="12" r="14" fill="#00f2fe" fill-opacity="0.15" />
    <text x="12" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" text-anchor="middle" fill="#00f2fe">🛰️</text>
    <text x="36" y="16" font-family="Segoe UI, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#f8fafc" letter-spacing="0.5">WatchGesture Telemetry Architecture</text>
    <text x="36" y="32" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94a3b8">End-to-End Real-Time GPS Tracking, Smartwatch Biometrics &amp; Bi-directional Screen Push</text>
  </g>

  <!-- ==================== NODE 1: SMARTWATCH ==================== -->
  <g transform="translate(40, 100)">
    <rect width="180" height="280" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="42" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    
    <!-- Title -->
    <text x="90" y="26" font-family="Segoe UI, -apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="#38bdf8">⌚ Smartwatch (BLE)</text>
    
    <!-- Subtitle / Model -->
    <text x="90" y="60" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#94a3b8">Realtek RTL8762 SoC</text>
    <text x="90" y="76" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">DaFit / Fire-Boltt / Realtek</text>
    
    <!-- Capabilities Boxes -->
    <g transform="translate(15, 96)">
      <rect width="150" height="42" rx="8" fill="#0b111a" stroke="#1e293b"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#f43f5e">❤️ Pulse Sensor</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">GATT 0x180D (0x2A37)</text>
    </g>

    <g transform="translate(15, 146)">
      <rect width="150" height="42" rx="8" fill="#0b111a" stroke="#1e293b"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#38bdf8">👟 Step Counter</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">GATT 0xFEE1 (0xF6...)</text>
    </g>

    <g transform="translate(15, 196)">
      <rect width="150" height="42" rx="8" fill="#0b111a" stroke="#1e293b"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#10b981">💬 On-Screen Alerts</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">Opcode 0x41 on FEE2</text>
    </g>

    <text x="90" y="260" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">No Onboard GNSS Needed</text>
  </g>

  <!-- ==================== FLOW 1: BLE LINK ==================== -->
  <g>
    <!-- Watch to Phone (HR & Steps) -->
    <path d="M 220 180 L 290 180" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>
    <text x="255" y="170" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#38bdf8">Web BLE</text>
    <text x="255" y="195" font-family="monospace" font-size="9" text-anchor="middle" fill="#64748b">HR + Steps</text>

    <!-- Phone to Watch (Text Push) -->
    <path d="M 290 290 L 220 290" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <text x="255" y="280" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#c084fc">Opcode 0x41</text>
    <text x="255" y="305" font-family="monospace" font-size="9" text-anchor="middle" fill="#64748b">CMD_SEND_MSG</text>
  </g>

  <!-- ==================== NODE 2: MOBILE PHONE ==================== -->
  <g transform="translate(290, 100)">
    <rect width="180" height="280" rx="14" fill="url(#cardGradAccent)" stroke="url(#cyanBorder)" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="42" rx="14" fill="#0f2b38" fill-opacity="0.8"/>
    
    <!-- Title -->
    <text x="90" y="26" font-family="Segoe UI, -apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="#00f2fe">📱 Phone Bridge</text>
    
    <!-- Subtitle -->
    <text x="90" y="60" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#94a3b8">phone_bridge.html</text>
    <text x="90" y="76" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Zero-Tap Autonomous Gateway</text>

    <!-- Capabilities Boxes -->
    <g transform="translate(15, 96)">
      <rect width="150" height="42" rx="8" fill="#06121e" stroke="#13364f"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#38bdf8">🛰️ Satellite GPS</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">watchPosition (±5m)</text>
    </g>

    <g transform="translate(15, 146)">
      <rect width="150" height="42" rx="8" fill="#06121e" stroke="#13364f"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#10b981">🔄 5s Auto-Loop</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">setInterval (Zero Taps)</text>
    </g>

    <g transform="translate(15, 196)">
      <rect width="150" height="42" rx="8" fill="#06121e" stroke="#13364f"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#c084fc">📡 SSE Listener</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">EventSource (Downstream)</text>
    </g>

    <text x="90" y="260" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#38bdf8">Runs in Mobile Browser</text>
  </g>

  <!-- ==================== FLOW 2: CLOUD RELAY LINK ==================== -->
  <g>
    <!-- Upstream HTTPS POST -->
    <path d="M 470 180 L 540 180" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="170" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#34d399">POST 5s</text>
    <text x="505" y="195" font-family="monospace" font-size="9" text-anchor="middle" fill="#64748b">JSON Body</text>

    <!-- Downstream SSE Stream -->
    <path d="M 540 290 L 470 290" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)"/>
    <text x="505" y="280" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#c084fc">SSE Channel</text>
    <text x="505" y="305" font-family="monospace" font-size="9" text-anchor="middle" fill="#64748b">Text Stream</text>
  </g>

  <!-- ==================== NODE 3: CLOUD RELAY ==================== -->
  <g transform="translate(540, 100)">
    <rect width="130" height="280" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="42" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    
    <!-- Title -->
    <text x="65" y="26" font-family="Segoe UI, -apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="#facc15">☁️ Cloud Relay</text>
    
    <!-- Subtitle -->
    <text x="65" y="60" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#94a3b8">ntfy.sh / MQTT</text>
    <text x="65" y="76" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Zero Account Relay</text>

    <g transform="translate(10, 110)">
      <rect width="110" height="56" rx="8" fill="#0b111a" stroke="#1e293b"/>
      <text x="55" y="22" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="10" text-anchor="middle" fill="#10b981">Upstream Topic</text>
      <text x="55" y="40" font-family="monospace" font-size="9" text-anchor="middle" fill="#94a3b8">/up/json</text>
    </g>

    <g transform="translate(10, 180)">
      <rect width="110" height="56" rx="8" fill="#0b111a" stroke="#1e293b"/>
      <text x="55" y="22" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="10" text-anchor="middle" fill="#a855f7">Downstream Topic</text>
      <text x="55" y="40" font-family="monospace" font-size="9" text-anchor="middle" fill="#94a3b8">/down/sse</text>
    </g>

    <text x="65" y="260" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Global PubSub</text>
  </g>

  <!-- ==================== FLOW 3: LAPTOP STREAM ==================== -->
  <g>
    <!-- Cloud to Laptop -->
    <path d="M 670 180 L 730 180" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="700" y="170" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#34d399">SSE Stream</text>
    <text x="700" y="195" font-family="monospace" font-size="9" text-anchor="middle" fill="#64748b">Raw Pings</text>

    <!-- Laptop to Cloud (Message Post) -->
    <path d="M 730 290 L 670 290" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <text x="700" y="280" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#c084fc">POST Text</text>
    <text x="700" y="305" font-family="monospace" font-size="9" text-anchor="middle" fill="#64748b">Instant Push</text>
  </g>

  <!-- ==================== NODE 4: LAPTOP / COMMAND CENTER ==================== -->
  <g transform="translate(730, 100)">
    <rect width="150" height="280" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="42" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    
    <!-- Title -->
    <text x="75" y="26" font-family="Segoe UI, -apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="#38bdf8">💻 Command Center</text>
    
    <!-- Subtitle -->
    <text x="75" y="60" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#94a3b8">Desktop HUD</text>
    <text x="75" y="76" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">live_map.html</text>

    <g transform="translate(10, 96)">
      <rect width="130" height="42" rx="8" fill="#0b111a" stroke="#1e293b"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#38bdf8">🗺️ Live Map HUD</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">Satellite Viewport</text>
    </g>

    <g transform="translate(10, 146)">
      <rect width="130" height="42" rx="8" fill="#0b111a" stroke="#1e293b"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#10b981">🐍 Telemetry Server</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">python run.py telem</text>
    </g>

    <g transform="translate(10, 196)">
      <rect width="130" height="42" rx="8" fill="#0b111a" stroke="#1e293b"/>
      <text x="10" y="18" font-family="Segoe UI, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#c084fc">⌨️ Terminal Push</text>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#94a3b8">Push to Watch Face</text>
    </g>

    <text x="75" y="260" font-family="Segoe UI, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#38bdf8">Local Port :8765</text>
  </g>
</svg>

