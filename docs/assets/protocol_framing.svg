<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="nodeShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="960" height="480" rx="14" fill="url(#bgGrad3)" stroke="#1e293b" stroke-width="1.5" />

  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">DAFIT / FIRE-BOLTT PROTOCOL FRAMING</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b">Binary packet format for GATT Service 0xFEEA (Write on FEE2, Notify on FEE3, Steps on FEE1)</text>

  <!-- BYTE STRIP VISUALIZATION -->
  <g transform="translate(40, 95)" filter="url(#nodeShadow)">
    <!-- Byte 0 -->
    <rect x="0" y="0" width="135" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="67" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">BYTE 0</text>
    <text x="67" y="48" font-family="'Consolas', monospace" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">0xFE</text>
    <text x="67" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Magic Header 1</text>

    <!-- Byte 1 -->
    <rect x="145" y="0" width="135" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="212" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">BYTE 1</text>
    <text x="212" y="48" font-family="'Consolas', monospace" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">0xEA</text>
    <text x="212" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Magic Header 2</text>

    <!-- Byte 2 -->
    <rect x="290" y="0" width="155" height="80" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="367" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#818cf8" text-anchor="middle">BYTE 2</text>
    <text x="367" y="48" font-family="'Consolas', monospace" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="middle">0x20 + (L&gt;&gt;8)</text>
    <text x="367" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Length High (0x10 if MTU=20)</text>

    <!-- Byte 3 -->
    <rect x="455" y="0" width="135" height="80" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="522" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#818cf8" text-anchor="middle">BYTE 3</text>
    <text x="522" y="48" font-family="'Consolas', monospace" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">L &amp; 0xFF</text>
    <text x="522" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Total Packet Length</text>

    <!-- Byte 4 -->
    <rect x="600" y="0" width="135" height="80" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="667" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">BYTE 4</text>
    <text x="667" y="48" font-family="'Consolas', monospace" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">OPCODE</text>
    <text x="667" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Command ID (e.g. 0x66)</text>

    <!-- Byte 5..N -->
    <rect x="745" y="0" width="135" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="812" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle">BYTE 5..N</text>
    <text x="812" y="48" font-family="'Consolas', monospace" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="middle">PAYLOAD</text>
    <text x="812" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Variable Data / Args</text>
  </g>

  <!-- TABLE: GROUND-TRUTH CAPTURED PACKETS -->
  <g transform="translate(40, 205)">
    <rect width="880" height="240" rx="10" fill="#131c2e" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">AUTHORITATIVE DAFIT / FIRE-BOLTT OPCODES (SERVICE 0xFEEA)</text>

    <line x1="20" y1="38" x2="860" y2="38" stroke="#1e293b" stroke-width="1" />

    <!-- Row 1: G-Sensor Shutter -->
    <text x="20" y="62" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#38bdf8">0x66 (102)</text>
    <text x="130" y="62" font-family="'Consolas', monospace" font-size="12" fill="#94a3b8">FE EA 20 06 66 01</text>
    <text x="330" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f1f5f9">Camera Mode &amp; Accelerometer Keepalive</text>
    <text x="650" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Out arms G-Sensor; In = wrist flick event</text>

    <!-- Row 2: Return Home / Abort -->
    <text x="20" y="92" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#c084fc">0x53 (83)</text>
    <text x="130" y="92" font-family="'Consolas', monospace" font-size="12" fill="#94a3b8">FE EA 20 05 53</text>
    <text x="330" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f1f5f9">Return Principal Screen (Fast Abort)</text>
    <text x="650" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Cancels shutter animation for rapid taps</text>

    <!-- Row 3: Watch Touch Media Controls -->
    <text x="20" y="122" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#34d399">0x67 (103)</text>
    <text x="130" y="122" font-family="'Consolas', monospace" font-size="12" fill="#94a3b8">FE EA 20 06 67 [OP]</text>
    <text x="330" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f1f5f9">Watch Touch Media &amp; Volume Events</text>
    <text x="650" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Incoming: Play, Pause, Next, Prev, Vol +/-</text>

    <!-- Row 4: Find Phone -->
    <text x="20" y="152" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#fbbf24">0x62 (98)</text>
    <text x="130" y="152" font-family="'Consolas', monospace" font-size="12" fill="#94a3b8">FE EA 20 06 62 [00]</text>
    <text x="330" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f1f5f9">Find My Phone Trigger</text>
    <text x="650" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Sent when user taps 'Find Phone' on watch</text>

    <!-- Row 5: Find Watch / Buzz -->
    <text x="20" y="182" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#f43f5e">0x61 (97)</text>
    <text x="130" y="182" font-family="'Consolas', monospace" font-size="12" fill="#94a3b8">FE EA 20 05 61</text>
    <text x="330" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f1f5f9">Find My Watch (Vibrate / Buzz)</text>
    <text x="650" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Commands the watch to vibrate immediately</text>

    <!-- Row 6: Zero G-Sensor -->
    <text x="20" y="212" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#38bdf8">0x52 (82)</text>
    <text x="130" y="212" font-family="'Consolas', monospace" font-size="12" fill="#94a3b8">FE EA 20 05 52</text>
    <text x="330" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f1f5f9">Accelerometer Calibration</text>
    <text x="650" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Zeroes the onboard 3-axis G-sensor</text>
  </g>
</svg>
