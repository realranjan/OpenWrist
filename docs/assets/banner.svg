<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="120" cy="120" r="140" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="860" cy="160" r="100" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Smartwatch Icon Graphic -->
  <g transform="translate(60, 48)">
    <!-- Watch Straps -->
    <rect x="36" y="0" width="48" height="24" rx="4" fill="#334155" />
    <rect x="36" y="120" width="48" height="24" rx="4" fill="#334155" />
    <!-- Watch Body -->
    <rect x="16" y="18" width="88" height="108" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="24" y="26" width="72" height="92" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Screen Elements -->
    <circle cx="60" cy="56" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 60 46 L 60 56 L 68 56" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Gesture Waves -->
    <path d="M 50 86 Q 60 76 70 86 Q 80 96 90 86" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 52 94 Q 60 88 68 94" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Crown Button -->
    <rect x="104" y="52" width="6" height="20" rx="2" fill="#64748b" />
  </g>

  <!-- Waveform Accents -->
  <path d="M 190 120 C 220 120, 230 70, 250 70 C 270 70, 280 170, 300 170 C 320 170, 330 120, 360 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Title & Branding -->
  <text x="240" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#brandGrad)" letter-spacing="-0.5">OpenWrist</text>
  <text x="240" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Smartwatch BLE Gesture Controller &amp; Autonomous Satellite Telemetry</text>

  <!-- Feature Pills -->
  <g transform="translate(240, 154)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <circle cx="14" cy="14" r="4" fill="#34d399" />
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Fire-Boltt 184 BLE</text>

    <!-- Pill 2 -->
    <rect x="140" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <circle cx="154" cy="14" r="4" fill="#38bdf8" />
    <text x="166" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">100% Native Python</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="155" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <circle cx="314" cy="14" r="4" fill="#a855f7" />
    <text x="326" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Multi-Tap Profiles</text>

    <!-- Pill 4 -->
    <rect x="465" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <circle cx="479" cy="14" r="4" fill="#fbbf24" />
    <text x="491" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Boss Key (Win+D)</text>
  </g>
</svg>

